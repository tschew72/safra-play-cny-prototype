<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Memory Match — Intro — SAFRA Play</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&family=Caveat:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" crossorigin href="./assets/theme-DbFIwzDo.css">
</head>
<body>
<div class="page">

<div class="gamebar">
  <a class="btn-exit" href="wave-1.html">← Exit game</a>
  <div class="brand-mini"><svg class="seal sm"><use href="#seal-goat"/></svg>SAFRA PLAY</div>
  <span class="user-chip on-red"><span class="avatar">T</span>tschew</span>
</div>

<div class="wrap intro-wrap">
  <div data-slider>
    <div class="intro-tags" style="display:flex;align-items:center;gap:10px;justify-content:center">
      <span class="tag tag-red">Wave 1</span>
      <span class="tag tag-jade">Easy</span>
    </div>
    <div style="position:relative;text-align:center;margin:16px 0 22px">
      <h1 class="display h-lg intro-title">Memory Match</h1>
      <a class="link-arrow intro-skip" href="round-briefing.html" style="position:absolute;right:0;top:50%;transform:translateY(-50%)">Skip intro ▸</a>
    </div>

    <div class="story-frame">
      <div class="story-art">
        <img class="art-img" src="./assets/art-story-Brgj2AVq.jpg" alt="Lee Jun Hao leaving his HDB flat with a 福 scroll on the door, goat on a distant hill"/>
      </div>
      <div class="story-caption">
        <span class="who">Lee Jun Hao</span>
        <span class="cap-divider"></span>
        <span class="quote">“It&rsquo;s the start of something bigger.”</span>
      </div>
    </div>

    <div class="pager">
      <button class="btn btn-ghost" data-prev>← Back</button>
      <span class="idx">1 / 4</span>
      <button class="btn btn-primary" data-next>Next →</button>
    </div>
  </div>
</div>

<!-- faint background clouds (artwork from approved comp 11) -->
<img class="intro-bg left" src="./assets/art-intro-cloud-left-C_AmlJFd.jpg" alt=""/>
<img class="intro-bg right" src="./assets/art-intro-cloud-right-DUA2sGgo.jpg" alt=""/>

</div>
<script src="assets/main.js"></script>
</body>
</html>
