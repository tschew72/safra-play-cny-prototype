<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Memory Match — SAFRA Play</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" crossorigin href="./assets/theme-DbFIwzDo.css">
</head>
<body>
<div class="page">

<div class="gamebar">
  <a class="btn-exit" href="wave-1.html">← Exit game</a>
  <div class="bar-title">Memory Match <span class="tag tag-jade">Easy</span></div>
  <span class="user-chip on-red"><span class="avatar">T</span>tschew</span>
</div>

<div class="wrap" style="text-align:center;padding-top:36px;padding-bottom:90px">

  <div class="stats-pill">
    <div class="seg"><span class="sic">👣</span><div><div class="lbl">Moves</div><div class="val" data-stat="moves">0</div></div></div>
    <div class="seg"><span class="sic">🀄</span><div><div class="lbl">Pairs</div><div class="val" data-stat="pairs">0 / 8</div></div></div>
    <div class="seg"><span class="sic">🔥</span><div><div class="lbl">Best Combo</div><div class="val" data-stat="best">–</div></div></div>
    <div class="seg"><span class="sic">⭐</span><div><div class="lbl">Score</div><div class="val" data-stat="score">0 XP</div></div></div>
  </div>

  <p class="mm-msg" data-mm-msg style="margin:22px 0 6px"></p>

  <div class="mm-board" data-mm style="margin-top:14px"></div>
</div>

<!-- cloud watermarks (artwork from approved memory-match comp) -->
<img src="./assets/art-mm-cloud-left-CGQ3Ebe-.jpg" alt="" style="position:fixed;left:0;bottom:0;width:min(420px,20vw);pointer-events:none;z-index:0"/>
<img src="./assets/art-mm-cloud-right-CXky06Ya.jpg" alt="" style="position:fixed;right:0;bottom:0;width:min(448px,22vw);pointer-events:none;z-index:0"/>

</div>
<script src="assets/main.js"></script>
</body>
</html>
