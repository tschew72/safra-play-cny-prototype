<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Defence Briefing — Quiz — SAFRA Play</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" crossorigin href="./assets/theme-DbFIwzDo.css">
</head>
<body>
<div class="page">

<div class="gamebar">
  <a class="btn-exit" href="wave-1.html">← Exit quiz</a>
  <div class="brand-mini"><svg class="seal sm"><use href="#seal-goat"/></svg>SAFRA PLAY</div>
  <span class="user-chip on-red"><span class="avatar">T</span>tschew</span>
</div>

<div class="quiz-stage" data-quiz>
  <p class="eyebrow" data-qflag>🚩&nbsp; Question 1 of 3</p>

  <div class="card card-lift quiz-card">
    <div class="q-strip">Defence Briefing</div>
    <div class="q-body">
      <div class="q-marks">
        <span class="q-mark red">✕</span>
        <span class="q-mark jade">✓</span>
      </div>
      <p class="q-text">Singapore celebrates National Day on 9 August.</p>
    </div>
  </div>

  <div class="quiz-answers">
    <button class="answer-btn" data-answer="true">
      <span class="cap jade">✓</span> TRUE
    </button>
    <button class="answer-btn" data-answer="false">
      <span class="cap red">✕</span> FALSE
    </button>
  </div>

  <div class="q-dots"><i class="now"></i><i></i><i></i></div>
</div>

<!-- background scene (artwork cropped from approved quiz comp 10) -->
<img class="quiz-bg bottom" src="./assets/art-quiz-bg-bottom-Dl7BLBGm.jpg" alt=""/>
<img class="quiz-bg left" src="./assets/art-quiz-bg-left-CWOm3-Z_.jpg" alt=""/>
<img class="quiz-bg right" src="./assets/art-quiz-bg-right-GDmfvmTq.jpg" alt=""/>

</div>
<script src="assets/main.js"></script>
</body>
</html>
